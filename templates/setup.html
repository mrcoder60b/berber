{% extends 'base.html' %}
{% block content %}
<div class="glass" style="max-width: 500px; margin: 4rem auto; padding: 2rem;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Sistem Kurulumu</h2>
    <p style="text-align: center; margin-bottom: 2rem; color: #94a3b8;">Sistemi başlatmak için ilk Usta (Admin) hesabını oluşturun.</p>
    
    <form method="POST">
        <div class="form-group">
            <label for="name">Ad Soyad</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Admin Hesabı Oluştur</button>
    </form>
</div>
{% endblock %}

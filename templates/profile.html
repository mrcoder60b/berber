{% extends 'dashboard_base.html' %}
{% block dashboard_content %}
<h2>Profil Ayarları</h2>
<p style="color: #94a3b8; margin-bottom: 2rem;">Kişisel bilgilerinizi ve profil fotoğrafınızı güncelleyin.</p>

<form method="POST" enctype="multipart/form-data" class="glass" style="padding: 1.5rem; max-width: 600px;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        {% if user.profile_photo == 'default.png' %}
            <div class="barber-avatar" style="display:inline-flex; align-items:center; justify-content:center; background: var(--bg-color); font-size: 3rem; margin: 0 auto 1rem auto;">
                👤
            </div>
        {% else %}
            <img src="{{ url_for('static', filename='images/profiles/' + user.profile_photo) }}" alt="Profil" class="barber-avatar" style="margin: 0 auto 1rem auto; display: block;">
        {% endif %}
        
        <div class="form-group">
            <label>Yeni Fotoğraf Yükle</label>
            <input type="file" name="photo" class="form-control" accept="image/*">
        </div>
    </div>

    <div class="form-group">
        <label>Ad Soyad</label>
        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
    </div>
    <div class="form-group">
        <label>Kullanıcı Adı</label>
        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
    </div>
    <div class="form-group">
        <label>Yeni Şifre (Değiştirmek istemiyorsanız boş bırakın)</label>
        <input type="password" name="password" class="form-control">
    </div>
    
    <button type="submit" class="btn btn-primary" style="width: 100%;">Değişiklikleri Kaydet</button>
</form>
{% endblock %}
